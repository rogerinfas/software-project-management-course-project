name: CD — Build · Push · Deploy

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  # ── 1. Validate all required secrets are set ───────────────────────────────
  preflight:
    name: Preflight — Validate secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}"
          test -n "${{ secrets.VPS_USER }}"
          test -n "${{ secrets.VPS_PORT }}"
          test -n "${{ secrets.VPS_KEY }}"
          test -n "${{ secrets.APP_PATH }}"
          test -n "${{ secrets.POSTGRES_DB }}"
          test -n "${{ secrets.POSTGRES_USER }}"
          test -n "${{ secrets.POSTGRES_PASSWORD }}"
          test -n "${{ secrets.BETTER_AUTH_SECRET }}"
          test -n "${{ secrets.REGISTRY_USERNAME }}"
          test -n "${{ secrets.REGISTRY_TOKEN }}"

  # ── 2. Build & push backend Docker image ───────────────────────────────────
  build-backend:
    name: Build & Push — Backend
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/school-backend:${{ github.sha }}
            ${{ secrets.REGISTRY_USERNAME }}/school-backend:latest

  # ── 3. Build & push frontend Docker image ──────────────────────────────────
  build-frontend:
    name: Build & Push — Frontend
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://apicolegio.celebrali.com
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/school-frontend:${{ github.sha }}
            ${{ secrets.REGISTRY_USERNAME }}/school-frontend:latest

  # ── 4. Deploy on VPS via SSH ────────────────────────────────────────────────
  deploy:
    name: Deploy — VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
          REPO_URL: https://github.com/rogerinfas/software-project-management-course-project.git
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_PATH,REPO_URL,BRANCH_NAME,IMAGE_TAG,REGISTRY_USERNAME,REGISTRY_TOKEN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,BETTER_AUTH_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD
          command_timeout: 30m
          script: |
            set -e

            # ── Clone or update repo ─────────────────────────────────────────
            if [ ! -d "$APP_PATH/.git" ]; then
              git clone "$REPO_URL" "$APP_PATH"
            fi

            cd "$APP_PATH"
            git fetch --all --prune
            git checkout "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            # ── Write backend .env ───────────────────────────────────────────
            cat > .env.backend << EOF
            PORT=5000
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL=https://apicolegio.celebrali.com
            WEB_URL=https://appcolegio.celebrali.com
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            TEACHER_EMAIL=teacher@santabeatriz.com
            TEACHER_PASSWORD=Teacher123!
            STAFF_EMAIL=staff@santabeatriz.com
            STAFF_PASSWORD=Staff123!
            ADMISSION_EMAIL=admission@santabeatriz.com
            ADMISSION_PASSWORD=Admission123!
            TREASURY_EMAIL=treasury@santabeatriz.com
            TREASURY_PASSWORD=Treasury123!
            EOF

            # ── Write root .env (docker-compose variables) ────────────────────
            cat > .env << EOF
            IMAGE_TAG=${IMAGE_TAG}
            BACKEND_IMAGE=${REGISTRY_USERNAME}/school-backend:${IMAGE_TAG}
            FRONTEND_IMAGE=${REGISTRY_USERNAME}/school-frontend:${IMAGE_TAG}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            BACKEND_PORT=5000
            FRONTEND_PORT=2000
            EOF

            # ── Clean stale containers ───────────────────────────────────────
            docker stop school-backend school-frontend school-postgres 2>/dev/null || true
            docker rm school-backend school-frontend school-postgres 2>/dev/null || true
            docker system prune -f

            # ── Pull latest images ───────────────────────────────────────────
            echo "${REGISTRY_TOKEN}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin

            docker compose -p school \
              -f devops/docker/docker-compose.prod.yml \
              pull backend frontend

            # ── Start database ───────────────────────────────────────────────
            docker compose -p school \
              -f devops/docker/docker-compose.prod.yml \
              up -d postgres

            # ── Run Prisma migrations ────────────────────────────────────────
            docker compose -p school \
              -f devops/docker/docker-compose.prod.yml \
              run --rm backend sh -c "pnpm prisma migrate deploy"

            # ── Start services ───────────────────────────────────────────────
            docker compose -p school \
              -f devops/docker/docker-compose.prod.yml \
              up -d backend frontend
